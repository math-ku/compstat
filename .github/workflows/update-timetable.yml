name: Update timetable

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-timetable
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: jolars
          extraPullNames: devenv
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Install devenv
        run: nix profile install --accept-flake-config nixpkgs#devenv

      - name: Fetch timetable
        run: devenv shell -- Rscript scripts/update-timetable.R

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- data/timetable.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify updated homepage
        if: steps.changes.outputs.changed == 'true'
        run: devenv shell -- quarto render index.qmd --profile publish

      - name: Commit timetable changes
        id: commit
        if: steps.changes.outputs.changed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/timetable.csv
          git commit -m 'chore: update course timetable'
          git push origin "HEAD:$DEFAULT_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ needs.update.outputs.revision }}
    secrets: inherit
